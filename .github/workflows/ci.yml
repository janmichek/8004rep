name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rep
          POSTGRES_PASSWORD: rep
          POSTGRES_DB: rep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rep -d rep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://rep:rep@localhost:5432/rep
      TEST_DATABASE_URL: postgres://rep:rep@localhost:5432/rep
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun run validate
      - name: Coverage floors did not decrease
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Update the remote-tracking ref the checker reads, not just FETCH_HEAD.
          git fetch --depth=1 origin "refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          bun scripts/ratchet-coverage.ts "origin/$BASE_REF"
      - run: bun run audit
      - run: bun run test:mutate
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
