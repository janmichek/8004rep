services:
  postgres:
    image: postgres:17-alpine
    container_name: 8004rep-postgres
    environment:
      POSTGRES_USER: rep
      POSTGRES_PASSWORD: rep
      POSTGRES_DB: rep
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rep -d rep']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: 8004rep
    container_name: 8004rep
    init: true
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgres://rep:rep@postgres:5432/rep
    depends_on:
      postgres:
        condition: service_healthy
    stdin_open: true
    tty: true

  indexer:
    build:
      context: .
      dockerfile: Dockerfile
    image: 8004rep
    container_name: 8004rep-indexer
    init: true
    command: ['bun', 'server/indexer/run.ts']
    environment:
      DATABASE_URL: postgres://rep:rep@postgres:5432/rep
      INDEXER_POLL_MS: '15000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
